<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Marks Management</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>Student Marks Management</h1>

        <p>
            Calculate total, percentage and identify the topper
        </p>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main>


        <!-- =========================
             STUDENT FORM
        ========================== -->

        <section class="form-section">

            <h2>Enter Student Details</h2>

            <form id="studentForm">

                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required
                    >

                </div>


                <!-- Roll Number -->

                <div class="form-group">

                    <label for="rollNo">
                        Roll Number
                    </label>

                    <input
                        type="number"
                        id="rollNo"
                        placeholder="Enter roll number"
                        required
                    >

                </div>


                <!-- Marks -->

                <div class="marks-grid">

                    <div class="form-group">

                        <label for="html">
                            HTML
                        </label>

                        <input
                            type="number"
                            id="html"
                            min="0"
                            max="100"
                            placeholder="0 - 100"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="css">
                            CSS
                        </label>

                        <input
                            type="number"
                            id="css"
                            min="0"
                            max="100"
                            placeholder="0 - 100"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="javascript">
                            JavaScript
                        </label>

                        <input
                            type="number"
                            id="javascript"
                            min="0"
                            max="100"
                            placeholder="0 - 100"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="react">
                            React
                        </label>

                        <input
                            type="number"
                            id="react"
                            min="0"
                            max="100"
                            placeholder="0 - 100"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="node">
                            Node.js
                        </label>

                        <input
                            type="number"
                            id="node"
                            min="0"
                            max="100"
                            placeholder="0 - 100"
                            required
                        >

                    </div>

                </div>


                <!-- Submit -->

                <button type="submit">
                    Add Student
                </button>

            </form>

        </section>


        <!-- =========================
             TOPPER
        ========================== -->

        <section class="topper-section">

            <h2>Topper</h2>

            <div id="topper">

                No student records available.

            </div>

        </section>


        <!-- =========================
             STUDENT TABLE
        ========================== -->

        <section class="table-section">

            <h2>Student Records</h2>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Roll No.</th>

                            <th>Name</th>

                            <th>Total</th>

                            <th>Percentage</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="studentTableBody">

                        <!-- JavaScript will add records here -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
