<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Street Scene</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Street Scene -->
    <div class="scene">
        <!-- Sky -->
        <div class="sky">
            <div class="sun"></div>
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
        </div>
        <!-- Traffic Signal -->
        <div class="traffic-signal">
            <div class="signal-box">
                <div class="light red"></div>
                <div class="light yellow"></div>
                <div class="light green"></div>
            </div>
            <div class="signal-pole"></div>
            <div class="signal-base"></div>
        </div>
        <!-- Road -->
        <div class="road">
            <div class="road-line line-1"></div>
            <div class="road-line line-2"></div>
            <div class="road-line line-3"></div>
            <div class="road-line line-4"></div>
            <!-- Car -->
            <div class="car">
                <div class="car-body">
                    <div class="car-window window-1"></div>
                    <div class="car-window window-2"></div>
                    <div class="headlight"></div>
                </div>
                <div class="wheel wheel-1"></div>
                <div class="wheel wheel-2"></div>
            </div>
        </div>
        <!-- Ground -->
        <div class="ground"></div>
    </div>
</body>
</html>
